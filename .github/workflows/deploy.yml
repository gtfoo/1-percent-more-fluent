name: Deploy to droplet

# Push to main -> SSH into the droplet, pull, rebuild, restart.
# Also runnable on demand from the Actions tab (e.g. after fixing a bad deploy).
on:
  push:
    branches: [main]
    # A deploy is not free: scripts/deploy.sh removes .next before rebuilding,
    # so for the length of a build the site serves pages with no styles and no
    # scripts. Paying that for a commit that cannot possibly change what is
    # served is waste - a test script or a paragraph of documentation took the
    # site down for three minutes more than once.
    #
    # These paths are pulled onto the droplet by the next real deploy anyway,
    # so nothing drifts. deploy.sh and verify-serving.sh are deliberately NOT
    # here: they run during a deploy, and a fix to one should take effect at
    # the next one rather than waiting for an unrelated change.
    paths-ignore:
      - "**.md"
      - ".env.example"
      - ".gitignore"
      - "scripts/check-*"
      - "scripts/droplet-*"
      - "scripts/inspect-*"
      - "scripts/peek-*"
      - "scripts/try-*"
      - ".github/**"
  # Still deployable by hand from the Actions tab - for a scripts-only change
  # you do want on the droplet now, or after fixing a bad deploy.
  workflow_dispatch: {}

# Never let two deploys overlap; queue them instead of interrupting a build.
concurrency:
  group: deploy-fluent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          # The action's default is 10 minutes, and a deploy has outgrown it:
          # `npm ci` alone took 8 on a 1 vCPU droplet, because better-sqlite3 is
          # compiled from source and two more provider SDKs joined the tree. The
          # build was then killed partway through.
          #
          # That failure is worse than it sounds. deploy.sh removes .next BEFORE
          # building, so a killed build leaves no output at all - the service
          # keeps serving from the process already in memory, reports healthy,
          # and would only have fallen over on its next restart.
          #
          # The droplet also hosts other apps, so a build can queue behind
          # someone else's native compile. 25 minutes is slack for both.
          command_timeout: 25m
          script: |
            set -e
            cd "${{ secrets.DROPLET_APP_DIR }}"
            git fetch --quiet origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
